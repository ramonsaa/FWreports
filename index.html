        /**
         * Displays a temporary alert message in the top right corner.
         * @param {string} message - The message to display.
         * @param {string} type - 'success' or 'error'.
         */
        function showMessage(message, type) {
            const isSuccess = type === 'success';
            messageBox.textContent = message;
            messageBox.className = `fixed top-4 right-4 z-50 p-4 rounded-lg font-semibold shadow-xl transition-opacity duration-300 ease-in-out ${isSuccess ? 'bg-green-500' : 'bg-red-500'}`;
            messageBox.classList.remove('hidden');

            // Hide after 4 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        /**
         * Formats a Date object to YYYY-MM-DD format (required by input[type=date]).
         * @param {Date} date - Date object to format.
         * @returns {string} Formatted date.
         */
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /**
         * Formats a date string to a readable date string.
         * @param {string} dateString - Date string from the input (YYYY-MM-DD).
         * @returns {string} Readable format.
         */
        function formatReadableDate(dateString) {
            if (!dateString) return 'N/A';
            // Ensure the input is treated as a date string without time zone offset issues
            const parts = dateString.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]); 
            
            if (isNaN(date)) {
                 // Fallback for non-standard date objects (e.g., from serverTimestamp)
                 try {
                    return new Date(dateString).toLocaleDateString('en-US', { 
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });
                 } catch {
                     return dateString;
                 }
            }

            // Options for a clear, professional look
            const options = {
                year: 'numeric', month: 'long', day: 'numeric'
            };
            return date.toLocaleDateString('en-US', options);
        }
        
        /**
         * NUEVO: Populates the state/province dropdown based on the selected country.
         */
        function populateStates(country) {
            const selectedCountry = country;
            const states = COUNTRY_STATES[selectedCountry] || [];
            
            stateSelect.innerHTML = ''; // Clear existing options

            if (states.length === 0) {
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "N/A";
                stateSelect.appendChild(option);
                return;
            }

            // Add a default placeholder
            const placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.textContent = "Select state / province...";
            placeholder.disabled = true;
            placeholder.selected = true;
            stateSelect.appendChild(placeholder);

            // Add the states/provinces
            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });
        }
        
        /**
         * NUEVO: Carga los técnicos desde Firestore y los almacena globalmente.
         */
        async function loadAndPopulateTechnicians() {
            try {
                const techCol = collection(db, 'technicians');
                // CAMBIO: Ordenar por 'techId' para consistencia
                const q = query(techCol, orderBy('techId')); 
                const querySnapshot = await getDocs(q);
                
                loadedTechnicians = []; // Limpiar el array
                querySnapshot.forEach(doc => {
                    // Guardar un objeto con el ID (T001) y el nombre (Ramon)
                    loadedTechnicians.push({
                        id: doc.data().techId,  // e.g., "T001"
                        name: doc.data().name // e.g., "Ramon"
                    });
                });

                // Poblar el dropdown
                populateTechnicianDropdown();

            } catch (error) {
                console.error("Error loading technicians:", error);
                showMessage("Error loading technician list. Check console and Firebase setup.", 'error');
                technicianNameSelect.innerHTML = '<option value="" disabled>Error loading technicians</option>';
            }
        }
        
        /**
         * NUEVO: Llena el dropdown de técnicos desde el array global 'loadedTechnicians'.
         */
        function populateTechnicianDropdown() {
            technicianNameSelect.innerHTML = ''; // Limpiar

            if (loadedTechnicians.length === 0) {
                technicianNameSelect.innerHTML = '<option value="" disabled>No technicians found</option>';
                return;
            }

            // Añadir placeholder
            const placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.textContent = "Select Technician";
            placeholder.disabled = true;
            technicianNameSelect.appendChild(placeholder);

            // Añadir técnicos
            loadedTechnicians.forEach(tech => {
                const option = document.createElement('option');

        /**
         * NUEVO: Carga la imagen del logo y la convierte a Base64 para el PDF.
         * Esto es necesario para que jsPDF pueda manejar la imagen de forma fiable.
         */
        async function getLogoBase64() {
            const logoEl = document.getElementById('companyLogo');
            const logoUrl = logoEl.src;

            // Si es un placeholder, no podemos cargarlo por CORS, así que lo saltamos.
            if (logoUrl.includes('placehold.co')) {
                 console.warn('PDF Export: Usando placeholder, el logo será omitido. Reemplaza la URL del logo.');
                 return null;
            }
            
            try {
                // Usamos fetch para obtener la imagen
                const response = await fetch(logoUrl, { mode: 'cors' }); // 'cors' es crucial
                if (!response.ok) return null;
                const blob = await response.blob();
                
                // Convertir Blob a Base64
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                // Un error de CORS es común si el servidor de la imagen no lo permite
                console.error("Error cargando logo para PDF (puede ser CORS):", error);
                showMessage("Error al cargar el logo para PDF. Asegúrate de que tu logo esté alojado en un sitio que permita CORS (como Imgur).", 'error');
                return null;
            }
        }

        // --- FIREBASE AND AUTHENTICATION HANDLING ---

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication
                await new Promise((resolve) => {
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            userId = user.uid;
                        } else {
                            await signInAnonymously(auth);
                        }
                        resolve();
                    });
                });

                // Once authenticated, get the final ID and configure the UI
                userId = auth.currentUser?.uid || crypto.randomUUID();
                // CAMBIO: Línea eliminada, el elemento HTML ya no existe
                // currentUserIdSpan.textContent = userId; 
                
                // CAMBIO: Cargar técnicos DESPUÉS de inicializar db
                await loadAndPopulateTechnicians();
                
                // CAMBIO: Obtener el ID del técnico guardado de localStorage
                const savedTechnicianId = localStorage.getItem('lastSelectedTechnicianId');
                let initialTechnicianId = null;

                if (savedTechnicianId && loadedTechnicians.some(t => t.id === savedTechnicianId)) {
                    initialTechnicianId = savedTechnicianId;
                    technicianNameSelect.value = savedTechnicianId;
                } else if (loadedTechnicians.length > 0) {
                    initialTechnicianId = loadedTechnicians[0].id; // Default al primero
                    technicianNameSelect.value = initialTechnicianId;
                }
                
                // CAMBIO: Llenar estados para el país inicial
                const savedCountry = localStorage.getItem('lastSelectedCountry') || 'USA';
                countrySelect.value = savedCountry;
                populateStates(savedCountry);
                
                // Initialize report listener con el técnico inicial
                if (initialTechnicianId) {
                    setupReportListener(initialTechnicianId); 
                }
                
                console.log("Firebase initialized and user authenticated:", userId);

            } catch (error) {
                console.error("Error in initFirebase:", error);
                
                if (error.code === 'auth/configuration-not-found') {
                    const friendlyError = "Error: Authentication (Sign-in) is not enabled in your Firebase project.";
                    showMessage(friendlyError, 'error');
                    document.getElementById('loadingMessage').textContent = friendlyError;
                } else {
                    showMessage(`Initialization error: ${error.message}`, 'error');
                    document.getElementById('loadingMessage').textContent = `Error: ${error.message}`;
                }
            }
        }

        /**
         * Saves or updates the service report in Firestore.
         */
        async function saveReport(e) {
            e.preventDefault();

            if (!db || !userId) {
                showMessage("Cannot save: Database persistence is currently disabled or failed to initialize.", 'error');
                return;
            }
            
            // CAMBIO: Lógica movida a la transacción si es un REPORTE NUEVO
            const currentReportId = reportIdInput.value;
            const isNewReport = currentReportId === ''; // Un reporte nuevo ya no tiene ID aleatorio
            
            // CAMBIO: Obtener ID y Nombre del técnico seleccionado
            const selectedTechId = technicianNameSelect.value;
            const selectedTechName = technicianNameSelect.options[technicianNameSelect.selectedIndex].text;

            const reportData = {
                // reportId: se asignará en la transacción o en la actualización
                clientName: document.getElementById('clientName').value,
                serviceDate: document.getElementById('serviceDate').value,
                issueDescription: document.getElementById('issueDescription').value,
                workPerformed: document.getElementById('workPerformed').value,
                status: document.getElementById('status').value,
                
                technicianId: selectedTechId, // CAMBIO: e.g., "T001"
                technicianName: selectedTechName, // CAMBIO: e.g., "Ramon"
                
                serviceType: serviceTypeSelect.value, 
                country: countrySelect.value, // NUEVO
                state: stateSelect.value,     // NUEVO
                address: addressInput.value,
                city: cityInput.value,
                zipCode: zipCodeInput.value,
                durationDays: parseInt(durationDaysInput.value || 0),
                durationHours: parseInt(durationHoursInput.value || 0),
                timestamp: serverTimestamp() 
            };
            
            // NOTA: La firma no se guarda en Firestore, solo se usa para el PDF.

            if (isNewReport) {
                // --- Lógica de transacción para NUEVOS reportes ---
                try {
                    const newReportId = await runTransaction(db, async (transaction) => {
                        // 1. Definir la referencia al contador
                        // CAMBIO: El path debe ser seguro para las reglas
                        const counterRef = doc(db, "metadata/reportCounter"); 
                        const counterDoc = await transaction.get(counterRef);

                        let newCount = 1; // Default si no existe
                        if (counterDoc.exists()) {
                            newCount = counterDoc.data().currentCount + 1;
                        }

                        // 2. Formatear el ID (ej: 1 -> SERVICE-000001)
                        const formattedId = "SERVICE-" + String(newCount).padStart(6, '0');
                        
                        // 3. Actualizar el contador en la transacción
                        transaction.set(counterRef, { currentCount: newCount });

                        // 4. Crear el nuevo reporte con el ID secuencial
                        // CAMBIO: Path actualizado a la colección pública 'service_reports'
                        const reportRef = doc(db, `service_reports`, formattedId);
                        reportData.reportId = formattedId; // Añadir el ID a los datos
                        transaction.set(reportRef, reportData);
                        
                        return formattedId;
                    });

                    showMessage(`Report ${newReportId} saved successfully!`, 'success');
                    newReport(); // Resetear el formulario

                } catch (error) {
                    console.error("Error in transaction:", error);
                    showMessage(`Error saving new report: ${error.message}`, 'error');
                }
            
            } else {
                // --- Lógica de ACTUALIZACIÓN para reportes existentes ---
                try {
                    reportData.reportId = currentReportId; // Asegurarse de que el ID está en los datos
                    // CAMBIO: Path actualizado a la colección pública 'service_reports'
                    const reportRef = doc(db, `service_reports`, currentReportId);
                    await setDoc(reportRef, reportData, { merge: true }); // Usar merge para actualizar
                    showMessage('Report updated successfully!', 'success');
                } catch (error) {
                    console.error("Error updating report:", error);
                    showMessage(`Error updating: ${error.message}`, 'error');
                }
            }
        }

        /**
         * Listens for changes in the reports collection and updates the list.
         * CAMBIO: La función ahora acepta 'technicianId' y maneja la anulación de suscripción.
         */
        function setupReportListener(technicianId) {
            
            // CAMBIO: Añadir una verificación de que db exista antes de usarlo.
            if (!db) {
                console.log("setupReportListener skipped: db is not ready.");
                return; 
            }

            // Si no hay técnico seleccionado (ej. "Select Technician"), mostrar mensaje.
            if (!technicianId) {
                reportsList.innerHTML = '<p class="text-center text-gray-500 py-4">Select a technician to see reports.</p>';
                return;
            }

            // CAMBIO: Anular la suscripción del listener anterior si existe
            if (currentReportListener) {
                currentReportListener();
            }

            // CAMBIO: Path actualizado a la colección pública 'service_reports'
            const reportsColRef = collection(db, `service_reports`);
            
            // CAMBIO: La consulta ahora filtra por 'technicianId' (String)
            const q = query(reportsColRef, 
                          where("technicianId", "==", technicianId), 
                          limit(10)); 

            // CAMBIO: Guardar la nueva función de anulación de suscripción
            currentReportListener = onSnapshot(q, (snapshot) => {
                const reports = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    reports.push({ ...data, id: doc.id }); 
                });
                
                // Sort client-side (in-memory) by serviceDate (descending)
                reports.sort((a, b) => {
                    const dateA = new Date(a.serviceDate);
                    const dateB = new Date(b.serviceDate);
                    if (isNaN(dateA) || isNaN(dateB)) return 0; // Skip if dates are invalid
                    return dateB - dateA;
                });

                // CAMBIO: Pasar el ID del técnico al renderizador
                renderReportList(reports, technicianId);
            }, (error) => {
                console.error("Error listening for reports:", error);
                showMessage("Error loading report list.", 'error');
            });
        }

        /**
         * Renders the list of reports in the DOM.
         * CAMBIO: Acepta 'technicianId' para mostrar mensajes de "no hay reportes" más claros.
         */
        function renderReportList(reports, technicianId) {
            // CAMBIO: Buscar y ocultar el mensaje de carga ANTES de borrar el innerHTML.
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.classList.add('hidden');
            }
            
            reportsList.innerHTML = ''; // Esta línea borra el loadingMessage, por eso se movió arriba.

            if (reports.length === 0) {
                // CAMBIO: Mensaje específico si no hay reportes para ese técnico
                // Buscar el nombre del técnico en el array global
                const techName = loadedTechnicians.find(t => t.id === technicianId)?.name || "the selected technician";
                reportsList.innerHTML = `<p class="text-center text-gray-500 py-4">No reports found for ${techName}.</p>`;
                return;
            }

            reports.forEach(report => {
                const statusColor = report.status === 'Completed' ? 'bg-green-100 text-green-800' : 
                                    report.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 
                                    'bg-red-100 text-red-800';

                // Format date for list display
                const date = formatReadableDate(report.serviceDate);
                
                // Construct full address for display
                // CAMBIO: Usar state y country
                const fullAddress = report.address ? `${report.address}, ${report.city || ''}, ${report.state || ''}` : `${report.city || ''}, ${report.state || ''}` || 'N/A';
                
                // Construct duration string for list display
                const days = report.durationDays || 0;
                const hours = report.durationHours || 0;
                let durationString = `${days}D ${hours}H`;


                const reportItem = document.createElement('div');
                reportItem.className = 'p-4 border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 cursor-pointer transition duration-150';
                reportItem.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-semibold text-brand-blue-dark">${report.reportId}</span>
                        <span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusColor}">${report.status}</span>
                    </div>
                    <p class="text-lg font-bold text-gray-800">${report.clientName}</p>
                    <p class="text-sm text-gray-600 mb-2">${fullAddress}</p>
                    <p class="text-xs text-gray-500">Date: ${date}</p>
                    <p class="text-xs text-gray-500">Duration: ${durationString}</p>
                    <p class="text-xs text-gray-500">Technician: ${report.technicianName || 'N/A'}</p>
                    <p class="text-xs text-gray-500">Type: ${report.serviceType || 'N/A'}</p> <!-- NUEVO -->
                `;

                // Event to load the report into the form for editing
                reportItem.addEventListener('click', () => editReport(report));
                reportsList.appendChild(reportItem);
            });
            lucide.createIcons(); // Re-render icons if any
        }
        
        /**
         * Loads the data of a selected report into the form for editing.
         * @param {Object} report - The report object.
         */
        function editReport(report) {
            reportIdInput.value = report.reportId;
            document.getElementById('clientName').value = report.clientName;
            serviceDateInput.value = report.serviceDate; 
            
            // Populate new fields
            // CAMBIO: Seleccionar basado en 'technicianId'
            technicianNameSelect.value = report.technicianId || ""; 
            if (technicianNameSelect.value === "") {
                technicianNameSelect.selectedIndex = 0; // Placeholder
            }
            
            serviceTypeSelect.value = report.serviceType || 'Paid service'; // NUEVO
            addressInput.value = report.address || '';
            cityInput.value = report.city || '';
            
            // CAMBIO: Lógica para cargar País y Estado
            countrySelect.value = report.country || 'USA'; // Cargar país, default a USA
            populateStates(countrySelect.value); // Poblar la lista de estados para ese país
            stateSelect.value = report.state || ''; // Seleccionar el estado guardado
            
            zipCodeInput.value = report.zipCode || '';
            durationDaysInput.value = report.durationDays || 0;
            durationHoursInput.value = report.durationHours || 0;

            document.getElementById('issueDescription').value = report.issueDescription;
            document.getElementById('workPerformed').value = report.workPerformed;
            document.getElementById('status').value = report.status;
            
            // NUEVO: Limpiar la firma al cargar un reporte antiguo
            if (signaturePadInstance) {
                signaturePadInstance.clear();
            }

            // Change button to 'Update Report' state
            saveButtonText.textContent = 'Update Report';
            saveIcon.setAttribute('data-lucide', 'edit-3');

            // Scroll to the form
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showMessage(`Editing report ${report.reportId} for ${report.clientName}`, 'success');
            lucide.createIcons();

            // CAMBIO: Al editar, actualizar el listener para mostrar 
            // los reportes del técnico que se está editando.
            if (technicianNameSelect.value) {
                setupReportListener(technicianNameSelect.value);
            }
        }
        
        /**
         * NUEVO: Busca un reporte específico por su ID y lo carga.
         */
        async function retrieveReportById() {
            const reportNumber = retrieveIdInput.value;
            if (!reportNumber) {
                showMessage("Please enter a service number.", 'error');
                return;
            }
            if (!db || !userId) {
                showMessage("Database is not connected.", 'error');
                return;
            }

            // Formatear el ID
            const fullReportId = "SERVICE-" + String(reportNumber).padStart(6, '0');
            
            showMessage(`Retrieving ${fullReportId}...`, 'success');
            
            try {
                // CAMBIO: Path actualizado a la colección pública 'service_reports'
                const reportRef = doc(db, `service_reports`, fullReportId);
                const docSnap = await getDoc(reportRef);

                if (docSnap.exists()) {
                    // Cargar el reporte en el editor
                    editReport(docSnap.data());
                    showMessage(`Report ${fullReportId} loaded.`, 'success');
                    retrieveIdInput.value = ''; // Limpiar el input
                } else {
                    showMessage(`Report ${fullReportId} not found.`, 'error');
                }
            } catch (error) {
                console.error("Error retrieving report:", error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        /**
         * NUEVO: Configura el lienzo de firma y el responsive.
         */
        function setupSignaturePad() {
            // Inicializar el pad
            signaturePadInstance = new SignaturePad(signaturePadCanvas, {
                backgroundColor: 'rgb(255, 255, 255)' // Fondo blanco
            });

            // Función para ajustar el tamaño del canvas (para responsive y DPI alto)
            function resizeCanvas() {
                try {
                    const ratio =  Math.max(window.devicePixelRatio || 1, 1);
                    const wrapper = document.getElementById('signaturePadWrapper');
                    signaturePadCanvas.width = wrapper.offsetWidth * ratio;
                    signaturePadCanvas.height = wrapper.offsetHeight * ratio;
                    signaturePadCanvas.getContext("2d").scale(ratio, ratio);
                    signaturePadInstance.clear(); // Limpiar al redimensionar
                } catch (e) {
                    console.error("Error al redimensionar el canvas de firma:", e);
                }
            }

            // Redimensionar al cambiar el tamaño de la ventana
            window.addEventListener("resize", resizeCanvas);
            // Redimensionar al inicio
            resizeCanvas();

            // Asignar el botón de borrar
            clearSignatureButton.addEventListener('click', () => {
                signaturePadInstance.clear();
            });
        }


        // --- INITIALIZATION AND LISTENERS ---
        
        /**
         * Main setup function to run the application.
         */
        function setupApp() {
            try {
                // 1. Setup UI elements immediately
                
                // CAMBIO: Poblar estados para el país por defecto (USA)
                console.log("setupApp: Populating states...");
                const initialCountry = localStorage.getItem('lastSelectedCountry') || 'USA';
                countrySelect.value = initialCountry;
                populateStates(initialCountry);

                // CAMBIO: newReport() se llamará después de cargar los técnicos
                
                console.log("setupApp: Creating icons...");
                lucide.createIcons();
                
                // NUEVO: Configurar el pad de firma
                console.log("setupApp: Setting up signature pad...");
                setupSignaturePad();
                
                // 2. Attach static listeners
                console.log("setupApp: Attaching listeners...");
                form.addEventListener('submit', saveReport);
                newReportButton.addEventListener('click', newReport);
                exportPdfButton.addEventListener('click', exportToPDF);
                
                // NUEVO: Listener para el botón Retrieve
                retrieveButton.addEventListener('click', retrieveReportById);
                
                // NUEVO: Listener para el cambio de técnico
                // CAMBIO: Ahora guarda 'technicianId' en localStorage
                technicianNameSelect.addEventListener('change', (e) => {
                    const selectedId = e.target.value;
                    if (selectedId) {
                        // 1. Guardar la selección en localStorage
                        localStorage.setItem('lastSelectedTechnicianId', selectedId);
                        // 2. Actualizar la lista de reportes
                        setupReportListener(selectedId);
                    }
                });
                
                // NUEVO: Listener para el cambio de PAÍS
                countrySelect.addEventListener('change', (e) => {
                    populateStates(e.target.value);
                    localStorage.setItem('lastSelectedCountry', e.target.value);
                });
                
                // 3. Initialize Firebase asynchronously for data persistence
                console.log("setupApp: Initializing Firebase...");
                initFirebase(); // initFirebase ahora llama a newReport() después de cargar técnicos
                console.log("setupApp: Setup complete.");
            } catch (e) {
                console.error("Error fatal en setupApp:", e);
                // No usar alert(), usar showMessage si está disponible, o console.error
                if (typeof showMessage === 'function') {
                    showMessage(`Error fatal en la aplicación: ${e.message}`, 'error');
                }
            }
        }

        // CAMBIO: Usar DOMContentLoaded en lugar de window.onload
        document.addEventListener('DOMContentLoaded', setupApp);
    </script>
</body>
</html>
