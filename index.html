        function showMessage(message, type) {

        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatReadableDate(dateString) {
            if (!dateString) return 'N/A';
            const parts = dateString.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]); 
            
            if (isNaN(date)) {
                 try {
                    return new Date(dateString).toLocaleDateString('en-US', { 
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });
                 } catch {
                     return dateString;
                 }
            }
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }
        
        function populateStates(country) {
            const selectedCountry = country;
            const states = COUNTRY_STATES[selectedCountry] || [];
            
            stateSelect.innerHTML = ''; 

            if (states.length === 0) {
                const option = document.createElement('option');
                option.value = "";
                option.textContent = "N/A";
                stateSelect.appendChild(option);
                return;
            }

            const placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.textContent = "Select state / province...";
            placeholder.disabled = true;
            placeholder.selected = true;
            stateSelect.appendChild(placeholder);

            states.forEach(state => {
                const option = document.createElement('option');
                option.value = state;
                option.textContent = state;
                stateSelect.appendChild(option);
            });
        }
        
        // Carga técnicos desde Firestore
        async function loadAndPopulateTechnicians() {
            try {
                const techCol = collection(db, 'technicians');
                const q = query(techCol, orderBy('techId')); 
                const querySnapshot = await getDocs(q);
                
                loadedTechnicians = []; 
                querySnapshot.forEach(doc => {
                    const data = doc.data();
                    loadedTechnicians.push({
                        id: data.techId, 
                        name: data.name,
                        defaultCountry: data.defaultCountry // Para futura referencia
                    });
                });

                populateTechnicianDropdown();

            } catch (error) {
                console.error("Error loading technicians:", error);
                showMessage("Error loading technician list from DB.", 'error');
                technicianNameSelect.innerHTML = '<option value="" disabled>Error loading technicians</option>';
            }
        }
        
        function populateTechnicianDropdown() {
            technicianNameSelect.innerHTML = ''; 

            if (loadedTechnicians.length === 0) {
                technicianNameSelect.innerHTML = '<option value="" disabled>No technicians found</option>';
                return;
            }

            const placeholder = document.createElement('option');
            placeholder.value = "";
            placeholder.textContent = "Select Technician";
            placeholder.disabled = true;
            technicianNameSelect.appendChild(placeholder);

            loadedTechnicians.forEach(tech => {
                const option = document.createElement('option');
                option.value = tech.id; 
                option.textContent = tech.name; 
                technicianNameSelect.appendChild(option);
            });

            const savedTechId = localStorage.getItem('lastSelectedTechnicianId');
            if (savedTechId && loadedTechnicians.some(t => t.id == savedTechId)) {
                technicianNameSelect.value = savedTechId;
            } else if (loadedTechnicians.length > 0) {
                technicianNameSelect.value = loadedTechnicians[0].id;
            }
        }
        
        // Helper para actualizar el país basado en el técnico
        function updateCountryFromTechnician(techId) {
            if (!techId) return;
            const tech = loadedTechnicians.find(t => t.id === techId);
            
            if (!tech || !tech.defaultCountry) {
                // Si no hay defaultCountry, mantenemos el país actual o USA
                return;
            }

            let countryValue = "USA"; 
            if (tech.defaultCountry === "M") countryValue = "Mexico";
            if (tech.defaultCountry === "C") countryValue = "Canada";
            if (tech.defaultCountry === "T") countryValue = "Trinidad & Tobago";

            countrySelect.value = countryValue;
            localStorage.setItem('lastSelectedCountry', countryValue);
            populateStates(countryValue);
        }

        async function getLogoBase64() {
            const logoEl = document.getElementById('companyLogo');
            const logoUrl = logoEl.src;

            if (logoUrl.includes('placehold.co')) {
                 console.warn('PDF Export: Usando placeholder, el logo será omitido.');
                 return null;
            }
            
            try {
                const response = await fetch(logoUrl, { mode: 'cors' });
                if (!response.ok) return null;
                const blob = await response.blob();
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.error("Error cargando logo para PDF:", error);
                return null;
            }
        }

        /**
         * Sube el archivo a Firebase Storage
         */
        async function uploadToFirebaseStorage(pdfBlob, fileName) {
            if (!storage) {
                console.error("Firebase Storage not initialized");
                showMessage("Error: Cloud storage not available.", 'error');
                return;
            }

            showMessage('Uploading to Firebase Storage...', 'success');
            
            try {
                // Referencia: carpeta 'pdf_reports' / nombre del archivo
                const storageRef = ref(storage, `pdf_reports/${fileName}`);
                
                // Subir
                const snapshot = await uploadBytes(storageRef, pdfBlob);
                console.log('Uploaded a blob or file!', snapshot);
                
                showMessage('PDF downloaded & uploaded to Cloud successfully!', 'success');

            } catch (error) {
                console.error("Firebase Storage Error:", error);
                showMessage(`Local save OK, but Cloud upload failed: ${error.message}`, 'error');
            }
        }

        // --- GUARDAR EN BASE DE DATOS (REUSABLE) ---
        async function performSave() {
            if (!db || !userId) {
                throw new Error("Database persistence is currently disabled or failed to initialize.");
            }
            
            const currentReportId = reportIdInput.value;
            const isNewReport = currentReportId === ''; 
            
            const selectedTechId = technicianNameSelect.value;
            const selectedTechName = technicianNameSelect.options[technicianNameSelect.selectedIndex].text;

            const reportData = {
                clientName: document.getElementById('clientName').value,
                serviceDate: document.getElementById('serviceDate').value,
                issueDescription: document.getElementById('issueDescription').value,
                workPerformed: document.getElementById('workPerformed').value,
                status: document.getElementById('status').value,
                
                technicianId: selectedTechId, 
                technicianName: selectedTechName, 
                
                serviceType: serviceTypeSelect.value, 
                country: countrySelect.value, 
                state: stateSelect.value,     
                address: addressInput.value,
                city: cityInput.value,
                zipCode: zipCodeInput.value,
                // CORRECCIÓN: Añadido || 0 para evitar NaN
                durationDays: parseInt(durationDaysInput.value || 0),
                durationHours: parseInt(durationHoursInput.value || 0),
                timestamp: serverTimestamp() 
            };
            
            if (isNewReport) {
                // --- Lógica de transacción para NUEVOS reportes ---
                const newReportId = await runTransaction(db, async (transaction) => {
                    const counterRef = doc(db, "metadata/reportCounter"); 
                    const counterDoc = await transaction.get(counterRef);

                    let newCount = 1; 
                    if (counterDoc.exists()) {
                        newCount = counterDoc.data().currentCount + 1;
                    }

                    const formattedId = "SERVICE-" + String(newCount).padStart(6, '0');
                    
                    transaction.set(counterRef, { currentCount: newCount });

                    const reportRef = doc(db, `service_reports`, formattedId);
                    reportData.reportId = formattedId; 
                    transaction.set(reportRef, reportData);
                    
                    return formattedId;
                });
                
                return { id: newReportId, isNew: true };
            
            } else {
                // --- Lógica de ACTUALIZACIÓN ---
                reportData.reportId = currentReportId; 
                const reportRef = doc(db, `service_reports`, currentReportId);
                await setDoc(reportRef, reportData, { merge: true }); 
                
                return { id: currentReportId, isNew: false };
            }
        }

        // --- WRAPPER PARA GUARDAR ---
        async function saveReportWrapper(e) {
            e.preventDefault();
            try {
                const result = await performSave();
                
                if (result.isNew) {
                    showMessage(`Report ${result.id} saved successfully!`, 'success');
                    
                    // ACTUALIZAR UI PARA MODO EDICIÓN
                    reportIdInput.value = result.id;
                    saveButtonText.textContent = 'Save Report'; 
                    saveIcon.setAttribute('data-lucide', 'edit-3'); 
                } else {
                    showMessage('Report updated successfully!', 'success');
                }
            } catch (error) {
                console.error("Error in saveReportWrapper:", error);
                showMessage(`Error saving: ${error.message}`, 'error');
            }
        }

        // --- REPORT LIST FUNCTIONS ---
        function setupReportListener(technicianId) {
            if (!db) {
                console.log("setupReportListener skipped: db is not ready.");
                return; 
            }

            if (!technicianId) {
                reportsList.innerHTML = '<p class="text-center text-gray-500 py-4">Select a technician to see reports.</p>';
                return;
            }

            if (currentReportListener) {
                currentReportListener();
            }

            const reportsColRef = collection(db, `service_reports`);
            
            const q = query(reportsColRef, 
                          where("technicianId", "==", technicianId), 
                          limit(10)); 

            currentReportListener = onSnapshot(q, (snapshot) => {
                const reports = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    reports.push({ ...data, id: doc.id }); 
                });
                
                reports.sort((a, b) => {
                    const dateA = new Date(a.serviceDate);
                    const dateB = new Date(b.serviceDate);
                    if (isNaN(dateA) || isNaN(dateB)) return 0; 
                    return dateB - dateA;
                });

                renderReportList(reports, technicianId);
            }, (error) => {
                console.error("Error listening for reports:", error);
                showMessage("Error loading report list.", 'error');
            });
        }

        function renderReportList(reports, technicianId) {
            const loadingMsg = document.getElementById('loadingMessage');
            if (loadingMsg) {
                loadingMsg.classList.add('hidden');
            }
            
            reportsList.innerHTML = ''; 

            if (reports.length === 0) {
                const techName = loadedTechnicians.find(t => t.id === technicianId)?.name || "the selected technician";
                reportsList.innerHTML = `<p class="text-center text-gray-500 py-4">No reports found for ${techName}.</p>`;
                return;
            }

            reports.forEach(report => {
                const statusColor = report.status === 'Completed' ? 'bg-green-100 text-green-800' : 
                                    report.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 
                                    'bg-red-100 text-red-800';

                const date = formatReadableDate(report.serviceDate);
                
                const fullAddress = report.address ? `${report.address}, ${report.city || ''}, ${report.state || ''}` : `${report.city || ''}, ${report.state || ''}` || 'N/A';
                
                const days = report.durationDays || 0;
                const hours = report.durationHours || 0;
                let durationString = `${days}D ${hours}H`;


                const reportItem = document.createElement('div');
                reportItem.className = 'p-4 border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 cursor-pointer transition duration-150';
                reportItem.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-semibold text-brand-blue-dark">${report.reportId}</span>
                        <span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusColor}">${report.status}</span>
                    </div>
                    <p class="text-lg font-bold text-gray-800">${report.clientName}</p>
                    <p class="text-sm text-gray-600 mb-2">${fullAddress}</p>
                    <p class="text-xs text-gray-500">Date: ${date}</p>
                    <p class="text-xs text-gray-500">Duration: ${durationString}</p>
                    <p class="text-xs text-gray-500">Technician: ${report.technicianName || 'N/A'}</p>
                    <p class="text-xs text-gray-500">Type: ${report.serviceType || 'N/A'}</p> 
                `;

                reportItem.addEventListener('click', () => editReport(report));
                reportsList.appendChild(reportItem);
            });
            lucide.createIcons(); 
        }

        // --- INITIALIZATION AND LISTENERS ---
        
        function setupSignaturePad() {
            const canvas = document.getElementById('signaturePad');
            const wrapper = document.getElementById('signaturePadWrapper');
            const clearBtn = document.getElementById('clearSignatureButton');

            if (!canvas || !wrapper || typeof SignaturePad === 'undefined') {
                console.warn("SignaturePad setup aborted: missing elements or library.");
                return;
            }

            signaturePadInstance = new SignaturePad(canvas, {
                backgroundColor: 'rgb(255, 255, 255)' 
            });

            function resizeCanvas() {
                try {
                    const ratio =  Math.max(window.devicePixelRatio || 1, 1);
                    canvas.width = wrapper.offsetWidth * ratio;
                    canvas.height = wrapper.offsetHeight * ratio;
                    canvas.getContext("2d").scale(ratio, ratio);
                    
                    if (signaturePadInstance) signaturePadInstance.clear();
                } catch (e) {
                    console.error("Error al redimensionar el canvas de firma:", e);
                }
            }

            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (signaturePadInstance) signaturePadInstance.clear();
                });
            }
        }

        // --- FIREBASE INITIALIZATION ---
        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                storage = getStorage(app);

                await new Promise((resolve) => {
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            userId = user.uid;
                        } else {
                            await signInAnonymously(auth);
                        }
                        resolve();
                    });
                });

                userId = auth.currentUser?.uid || crypto.randomUUID();
                
                await loadAndPopulateTechnicians();
                
                // Configurar técnico inicial
                const savedTechnicianId = localStorage.getItem('lastSelectedTechnicianId');
                let initialTechnicianId = null;

                if (savedTechnicianId && loadedTechnicians.some(t => t.id === savedTechnicianId)) {
                    initialTechnicianId = savedTechnicianId;
                    technicianNameSelect.value = savedTechnicianId;
                } else if (loadedTechnicians.length > 0) {
                    initialTechnicianId = loadedTechnicians[0].id; 
                    technicianNameSelect.value = initialTechnicianId;
                }
                
                // Configurar país inicial
                const savedCountry = localStorage.getItem('lastSelectedCountry') || 'USA';
                countrySelect.value = savedCountry;
                populateStates(savedCountry);
                
                // Actualizar listener si hay técnico
                if (initialTechnicianId) {
                    setupReportListener(initialTechnicianId);
                    // Actualizar país basado en el técnico (si tiene default)
                    updateCountryFromTechnician(initialTechnicianId);
                }
                
                // IMPORTANTE: Llamar a newReport para inicializar el formulario correctamente
                newReport();
                
                console.log("Firebase initialized and user authenticated:", userId);

            } catch (error) {
                console.error("Error in initFirebase:", error);
                
                if (error.code === 'auth/configuration-not-found') {
                    const friendlyError = "Error: Authentication (Sign-in) is not enabled in your Firebase project.";
                    showMessage(friendlyError, 'error');
                    document.getElementById('loadingMessage').textContent = friendlyError;
                } else {
                    showMessage(`Initialization error: ${error.message}`, 'error');
                    document.getElementById('loadingMessage').textContent = `Error: ${error.message}`;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', setupApp);
    </script>
</body>
</html>
