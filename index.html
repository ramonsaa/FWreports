<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexo Wash Service Report</title>
    
    <!-- Carga de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- NUEVA LIBRERÍA PDF: jsPDF (reemplaza a html2pdf) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Configuración del font Inter por defecto -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f7f9; /* Light gray background */
        }
        .main-container {
            max-width: 100%;
            padding: 1rem;
        }
        @media (min-width: 640px) {
            .main-container {
                max-width: 900px;
                padding: 2rem;
            }
        }
        /* Custom brand colors for Tailwind */
        .brand-blue-dark {
            background-color: #1E3A8A; /* Dark blue from logo */
        }
        .brand-blue-light {
            color: #BFDBFE; /* Light blue from logo (for text/icons) */
        }
        .text-brand-blue-dark {
            color: #1E3A8A;
        }
        .text-brand-orange {
            color: #F97316; /* Orange from second logo, for accents */
        }
        .bg-brand-blue-dark {
            background-color: #1E3A8A;
        }
        .hover\:bg-brand-blue-dark-hover:hover {
            background-color: #1a327a; /* Slightly darker for hover */
        }
        .bg-brand-orange {
            background-color: #F97316;
        }

            background-color: #e06612; /* Slightly darker for hover */

        /* La sección de estilos PDF .pdf-report-container ya no es necesaria */
    </style>
    
    <!-- Carga de íconos Lucide para React -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen">

    <div class="main-container mx-auto">
        <header class="bg-white shadow-lg p-4 rounded-xl mb-6 flex justify-between items-center">
            <!-- HEADER FIX: Increased size to 3xl and explicit 'flex items-center' for robust alignment -->
            <h1 class="text-3xl font-bold text-gray-800 flex items-center space-x-2">
                <!-- IMPORTANT: URL del logo actualizada -->
                <img src="https://www.flexowash.com/hs-fs/hubfs/FW%20logo%20original_100px.png?width=330&height=83&name=FW%20logo%20original_100px.png" alt="Flexo Wash Logo" class="h-9" id="companyLogo" crossOrigin="anonymous"> 
                <span class="text-brand-blue-dark">Service Report</span>
            </h1>
            <button id="newReportButton" class="px-4 py-2 bg-brand-orange text-white font-semibold rounded-lg shadow-md hover:bg-brand-orange-hover transition duration-150 flex items-center">
                <i data-lucide="plus-circle" class="w-5 h-5 mr-1"></i>
                New Report
            </button>
        </header>

        <!-- Contenedor de Alertas Personalizado -->
        <div id="messageBox" class="hidden fixed top-4 right-4 z-50 p-4 rounded-lg text-white font-semibold shadow-xl transition-opacity duration-300 ease-in-out" role="alert"></div>

        <!-- Sección de Formulario de Reporte -->
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">Service Details</h2>
            <form id="serviceReportForm" class="space-y-4">
                
                <input type="hidden" id="reportId" value="">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Technician Name Dropdown -->
                    <div>
                        <label for="technicianName" class="block text-sm font-medium text-gray-700">Technician Name</label>
                        <select id="technicianName" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                            <option value="" disabled selected>Select Technician</option>
                            <!-- Options populated by JS -->
                        </select>
                    </div>

                    <!-- NUEVO: Service Type Dropdown -->
                    <div>
                        <label for="serviceType" class="block text-sm font-medium text-gray-700">Service Type</label>
                        <select id="serviceType" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                            <option value="Paid service">Paid service</option>
                            <option value="PM service">PM service</option>
                            <option value="Warranty LLC">Warranty LLC</option>
                            <option value="Warranty APS">Warranty APS</option>
                        </select>
                    </div>
                </div>


                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Service Date (now only date) -->
                    <div>
                        <label for="serviceDate" class="block text-sm font-medium text-gray-700">Service Date</label>
                        <input type="date" id="serviceDate" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                    </div>
                    <div>
                        <label for="clientName" class="block text-sm font-medium text-gray-700">Client Name</label>
                        <input type="text" id="clientName" required placeholder="Ex: ABC Company Inc." class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                    </div>
                </div>

                <!-- NEW: Service Duration Fields -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Service Duration</label>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex items-center space-x-2">
                            <input type="number" id="durationDays" min="0" required value="0" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark text-right">
                            <span class="text-sm font-medium text-gray-700">Days</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <input type="number" id="durationHours" min="0" max="23" required value="8" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark text-right">
                            <span class="text-sm font-medium text-gray-700">Hours</span>
                        </div>
                    </div>
                </div>

                <!-- Separate Location Fields -->
                <div>
                    <label class="block text-sm font-medium text-gray-700">Service Location</label>
                    <div class="space-y-2 mt-1">
                        <input type="text" id="address" required placeholder="Address (Ex: Main Street #123)" class="block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input type="text" id="city" required placeholder="City" class="block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                            <input type="text" id="state" required placeholder="State / Province" class="block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                            <input type="text" id="zipCode" required placeholder="Zip Code" class="block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                        </div>
                    </div>
                </div>

                <div>
                    <label for="issueDescription" class="block text-sm font-medium text-gray-700">Issue Description</label>
                    <textarea id="issueDescription" rows="3" required placeholder="Detail the issue reported by the client" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark"></textarea>
                </div>

                <div>
                    <label for="workPerformed" class="block text-sm font-medium text-gray-700">Work Performed / Solution</label>
                    <textarea id="workPerformed" rows="5" required placeholder="Detail the actions taken and the outcome" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="status" class="block text-sm font-medium text-gray-700">Report Status</label>
                        <select id="status" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-2 border focus:ring-brand-blue-dark focus:border-brand-blue-dark">
                            <option value="Completed">Completed</option>
                            <option value="Pending">Pending (Requires Follow-up)</option>
                            <option value="Canceled">Canceled</option>
                        </select>
                    </div>
                </div>

                <div class="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- SAVE/UPDATE BUTTON: Added IDs for text and icon to allow precise JS manipulation -->
                    <button type="submit" id="saveButton" class="w-full px-4 py-3 bg-brand-blue-dark text-white font-bold rounded-lg shadow-md hover:bg-brand-blue-dark-hover transition duration-150 flex items-center justify-center">
                        <i data-lucide="save" id="saveIcon" class="w-5 h-5 mr-2"></i>
                        <span id="saveButtonText">Save Report</span>
                    </button>
                    <button type="button" id="exportPdfButton" class="w-full px-4 py-3 bg-brand-orange text-white font-bold rounded-lg shadow-md hover:bg-brand-orange-hover transition duration-150 flex items-center justify-center">
                        <i data-lucide="file-text" class="w-5 h-5 mr-2"></i>
                        Export to PDF
                    </button>
                </div>
            </form>
        </div>

        <!-- Sección de Listado de Reportes -->
        <div class="bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-semibold mb-4 border-b pb-2 text-gray-700">Saved Reports (Last 10)</h2>
            <div id="reportsList" class="space-y-4">
                <p class="text-center text-gray-500" id="loadingMessage">Loading reports...</p>
                <!-- Reports will be inserted here -->
            </div>
            <p class="mt-4 text-xs text-center text-gray-400">Your User ID (for sharing): <span id="currentUserId" class="font-mono text-gray-600 break-all">Loading...</span></p>
        </div>

    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        <!-- CAMBIO: Versiones actualizadas a 12.4.0 -->
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, limit, serverTimestamp, setLogLevel } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
        
        // --- GLOBAL CONSTANTS ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'flexowash-service-reports';
        
        // CAMBIO: Configuración de Firebase insertada (con espacios corregidos)
        const firebaseConfig = {
            apiKey: "AIzaSyDkYxAPCDKgt4QcZ44Nz72ZWYBzSMtyJCU",
            authDomain: "fw-reports.firebaseapp.com",
            projectId: "fw-reports",
            storageBucket: "fw-reports.firebasestorage.app",
            messagingSenderId: "161658306989",
            appId: "1:161658306989:web:e38a7964295b1bf6396124"
        };
        
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
        
        // List of technicians (hardcoded)
        const TECHNICIANS = ["Ramon", "Ryan", "Isaac", "Daniel"];

        // DOM References
        const form = document.getElementById('serviceReportForm');
        const reportsList = document.getElementById('reportsList');
        const newReportButton = document.getElementById('newReportButton');
        const technicianNameSelect = document.getElementById('technicianName');
        const serviceTypeSelect = document.getElementById('serviceType'); // NUEVO
        const serviceDateInput = document.getElementById('serviceDate');
        const currentUserIdSpan = document.getElementById('currentUserId');
        const reportIdInput = document.getElementById('reportId');
        const messageBox = document.getElementById('messageBox');
        const exportPdfButton = document.getElementById('exportPdfButton');
        
        // NEW DOM References for Save Button
        const saveButtonText = document.getElementById('saveButtonText');
        const saveIcon = document.getElementById('saveIcon');
        
        // New Duration Fields
        const durationDaysInput = document.getElementById('durationDays');
        const durationHoursInput = document.getElementById('durationHours');

        // New Address Fields
        const addressInput = document.getElementById('address');
        const cityInput = document.getElementById('city');
        const stateInput = document.getElementById('state');
        const zipCodeInput = document.getElementById('zipCode');
        
        let db;
        let auth;
        let userId = 'loading';
        
        // --- UTILITIES ---

        /**
         * Displays a temporary alert message in the top right corner.
         * @param {string} message - The message to display.
         * @param {string} type - 'success' or 'error'.
         */
        function showMessage(message, type) {
            const isSuccess = type === 'success';
            messageBox.textContent = message;
            messageBox.className = `fixed top-4 right-4 z-50 p-4 rounded-lg font-semibold shadow-xl transition-opacity duration-300 ease-in-out ${isSuccess ? 'bg-green-500' : 'bg-red-500'}`;
            messageBox.classList.remove('hidden');

            // Hide after 4 seconds
            setTimeout(() => {
                messageBox.classList.add('hidden');
            }, 4000);
        }

        /**
         * Generates a simple unique report ID (simulating UUID).
         * CAMBIO: El prefijo es 'SERVICE-'
         * @returns {string} Unique ID.
         */
        function generateReportId() {
            return 'SERVICE-' + Math.random().toString(36).substring(2, 9).toUpperCase();
        }

        /**
         * Formats a Date object to YYYY-MM-DD format (required by input[type=date]).
         * @param {Date} date - Date object to format.
         * @returns {string} Formatted date.
         */
        function formatDateLocal(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        /**
         * Formats a date string to a readable date string.
         * @param {string} dateString - Date string from the input (YYYY-MM-DD).
         * @returns {string} Readable format.
         */
        function formatReadableDate(dateString) {
            if (!dateString) return 'N/A';
            // Ensure the input is treated as a date string without time zone offset issues
            const parts = dateString.split('-');
            const date = new Date(parts[0], parts[1] - 1, parts[2]); 
            
            if (isNaN(date)) {
                 // Fallback for non-standard date objects (e.g., from serverTimestamp)
                 try {
                    return new Date(dateString).toLocaleDateString('en-US', { 
                        year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                    });
                 } catch {
                     return dateString;
                 }
            }

            // Options for a clear, professional look
            const options = {
                year: 'numeric', month: 'long', day: 'numeric'
            };
            return date.toLocaleDateString('en-US', options);
        }

        /**
         * Populates the technician dropdown with names from the TECHNICIANS array.
         */
        function populateTechnicianDropdown() {
            TECHNICIANS.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                technicianNameSelect.appendChild(option);
            });
            // Ensure the first option is selected if it's not the disabled one
            if (technicianNameSelect.options.length > 1) {
                technicianNameSelect.value = TECHNICIANS[0]; 
            }
        }

        /**
         * NUEVO: Carga la imagen del logo y la convierte a Base64 para el PDF.
         * Esto es necesario para que jsPDF pueda manejar la imagen de forma fiable.
         */
        async function getLogoBase64() {
            const logoEl = document.getElementById('companyLogo');
            const logoUrl = logoEl.src;

            // Si es un placeholder, no podemos cargarlo por CORS, así que lo saltamos.
            if (logoUrl.includes('placehold.co')) {
                 console.warn('PDF Export: Usando placeholder, el logo será omitido. Reemplaza la URL del logo.');
                 return null;
            }
            
            try {
                // Usamos fetch para obtener la imagen
                const response = await fetch(logoUrl, { mode: 'cors' }); // 'cors' es crucial
                if (!response.ok) return null;
                const blob = await response.blob();
                
                // Convertir Blob a Base64
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                // Un error de CORS es común si el servidor de la imagen no lo permite
                console.error("Error cargando logo para PDF (puede ser CORS):", error);
                showMessage("Error al cargar el logo para PDF. Asegúrate de que tu logo esté alojado en un sitio que permita CORS (como Imgur).", 'error');
                return null;
            }
        }


        // --- PDF EXPORT FUNCTIONALITY (REESCRITO CON jspdf) ---

        /**
         * NUEVO: exportToPDF
         * Genera el PDF "dibujando" el contenido con la API de jsPDF.
         */
        async function exportToPDF() {
            // 1. Revisar campos requeridos
            const requiredFields = [
                document.getElementById('clientName').value,
                document.getElementById('serviceDate').value,
                document.getElementById('issueDescription').value,
                document.getElementById('workPerformed').value,
                technicianNameSelect.value,
                serviceTypeSelect.value, // NUEVO
                addressInput.value,
                cityInput.value,
                stateInput.value,
                zipCodeInput.value
            ];

            const allFieldsFilled = requiredFields.every(value => value.trim() !== '');

            if (!allFieldsFilled) {
                showMessage("Please fill in all required fields (Client, Date, Location, Description, Work Performed, Service Type) before exporting.", 'error');
                return;
            }

            // 2. Recolectar datos
            const reportData = {
                reportId: reportIdInput.value,
                clientName: document.getElementById('clientName').value,
                serviceDate: document.getElementById('serviceDate').value,
                issueDescription: document.getElementById('issueDescription').value,
                workPerformed: document.getElementById('workPerformed').value,
                status: document.getElementById('status').value,
                technicianName: technicianNameSelect.value,
                serviceType: serviceTypeSelect.value, // NUEVO
                address: addressInput.value,
                city: cityInput.value,
                state: stateInput.value,
                zipCode: zipCodeInput.value,
                durationDays: durationDaysInput.value,
                durationHours: durationHoursInput.value
            };
            
            // CAMBIO: El nombre del archivo ahora es solo el ID del reporte
            const fileName = `${reportData.reportId}.pdf`;

            showMessage('Generating PDF...', 'success');

            try {
                // 3. Inicializar jsPDF
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4'); // 'p'ortrait, 'mm', A4 size
                const logoData = await getLogoBase64(); // Esperar a que el logo cargue

                // Definir constantes de layout
                const pageWidth = doc.internal.pageSize.getWidth();
                const margin = 14;
                const contentWidth = pageWidth - (margin * 2);
                const x_center = pageWidth / 2;
                let y = 20; // Posición Y actual (va incrementando)

                // 4. DIBUJAR EL PDF
                
                // --- Encabezado ---
                if (logoData) {
                    // Nota: 40x10 son dimensiones de ejemplo, ajusta si es necesario
                    doc.addImage(logoData, 'PNG', margin, 15, 40, 10); 
                }
                doc.setFontSize(20);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#1E3A8A');
                doc.text('Service Report', pageWidth - margin, 22, { align: 'right' });
                y = 35; // Bajar Y
                doc.setLineWidth(1);
                doc.setDrawColor('#1E3A8A');
                doc.line(margin, y, pageWidth - margin, y); // Línea horizontal
                y += 10;

                // --- ID de Reporte y Status ---
                doc.setFontSize(10);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563'); // Gris
                doc.text('Report ID:', margin, y);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937'); // Negro
                doc.text(reportData.reportId, margin + 25, y);

                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563'); // Gris
                doc.text('Status:', pageWidth - margin - 30, y);
                doc.setFont('helvetica', 'bold');
                const statusColor = reportData.status === 'Completed' ? '#10B981' : reportData.status === 'Pending' ? '#F59E0B' : '#EF4444';
                doc.setTextColor(statusColor);
                doc.text(reportData.status, pageWidth - margin, y, { align: 'right' });
                y += 10;

                // --- Caja de Cliente y Ubicación ---
                doc.setFillColor('#E0E7FF'); // Azul claro
                doc.roundedRect(margin, y, contentWidth, 50, 3, 3, 'F'); // x, y, w, h, rx, ry, style
                
                let box_y = y + 10;
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#1E3A8A');
                doc.text('Client & Location Details', margin + 5, box_y);
                box_y += 10;
                
                // Cliente y Fecha (Columnas)
                doc.setFontSize(9);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563');
                doc.text('Client Name:', margin + 5, box_y);
                doc.text('Service Date:', x_center, box_y);
                
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                doc.text(reportData.clientName, margin + 30, box_y);
                doc.text(formatReadableDate(reportData.serviceDate), x_center + 30, box_y);
                box_y += 10;

                // Dirección
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563');
                doc.text('Address:', margin + 5, box_y);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                doc.text(reportData.address, margin + 30, box_y);
                box_y += 10;
                
                // City, State, Zip (3 columnas)
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563');
                doc.text('City:', margin + 5, box_y);
                doc.text('State/Province:', margin + 65, box_y);
                doc.text('Zip Code:', margin + 125, box_y);
                
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                doc.text(reportData.city, margin + 20, box_y);
                doc.text(reportData.state, margin + 90, box_y);
                doc.text(reportData.zipCode, margin + 145, box_y);
                y += 60; // Incrementar Y para pasar la caja

                // --- Información de Servicio (Sección Naranja) ---
                // CAMBIO: Línea vertical más alta
                doc.setLineWidth(1);
                doc.setDrawColor('#F97316'); // Naranja
                doc.line(margin, y, margin, y + 25); // Línea vertical
                
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#1E3A8A');
                doc.text('Service Information', margin + 5, y + 5);
                y += 15;
                
                // Cálculo de duración
                let durationString = '';
                const days = parseInt(reportData.durationDays || 0);
                const hours = parseInt(reportData.durationHours || 0);
                if (days > 0) durationString += `${days} Day${days !== 1 ? 's' : ''}`;
                if (days > 0 && hours > 0) durationString += ' and ';
                if (hours > 0) durationString += `${hours} Hour${hours !== 1 ? 's' : ''}`;
                if (!durationString) durationString = 'Not recorded';

                // CAMBIO: Layout de 2 líneas
                doc.setFontSize(9);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563');
                doc.text('Technician Name:', margin + 5, y);
                doc.text('Service Duration:', x_center, y);
                
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                doc.text(reportData.technicianName, margin + 40, y);
                doc.text(durationString, x_center + 35, y);
                y += 7; // Siguiente línea

                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#4B5563');
                doc.text('Service Type:', margin + 5, y);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                doc.text(reportData.serviceType, margin + 40, y);
                
                y += 13; // Padding

                // --- Descripción de Problema (Texto largo) ---
                doc.setDrawColor('#F97316'); // Naranja
                doc.line(margin, y, margin, y + 10); // Línea vertical corta
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#1E3A8A');
                doc.text('Issue Description', margin + 5, y + 5);
                y += 15;
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                // Usar splitTextToSize para manejar texto largo y saltos de línea
                const issueLines = doc.splitTextToSize(reportData.issueDescription, contentWidth - 5);
                doc.text(issueLines, margin + 5, y);
                y += (issueLines.length * 5) + 10; // 5mm por línea + 10mm padding

                // --- Trabajo Realizado (Texto largo) ---
                doc.setDrawColor('#F97316'); // Naranja
                doc.line(margin, y, margin, y + 10); // Línea vertical corta
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.setTextColor('#1E3A8A');
                doc.text('Work Performed / Solution', margin + 5, y + 5);
                y += 15;
                
                doc.setFontSize(10);
                doc.setFont('helvetica', 'normal');
                doc.setTextColor('#1F2937');
                const workLines = doc.splitTextToSize(reportData.workPerformed, contentWidth - 5);
                doc.text(workLines, margin + 5, y);
                y += (workLines.length * 5) + 10;

                // --- Footer (al final de la página) ---
                const pageHeight = doc.internal.pageSize.getHeight();
                doc.setLineWidth(0.5);
                doc.setDrawColor('#E5E7EB'); // Gris claro
                doc.line(margin, pageHeight - 20, pageWidth - margin, pageHeight - 20);
                
                doc.setFontSize(8);
                doc.setTextColor('#6B7280');
                // CAMBIO: Fecha de servicio en lugar de fecha de generación
                doc.text(`Service Date: ${formatReadableDate(reportData.serviceDate)}`, x_center, pageHeight - 15, { align: 'center' });
                // CAMBIO: Email actualizado
                doc.text('Contact us at: service@flexowashus.com', x_center, pageHeight - 10, { align: 'center' });

                // 5. Guardar el archivo
                doc.save(fileName);
                showMessage('PDF exported successfully!', 'success');

            } catch (error) {
                console.error("PDF Export Error:", error);
                showMessage(`Error generating PDF: ${error.message}`, 'error');
            }
        }


        // --- FIREBASE AND AUTHENTICATION HANDLING ---

        async function initFirebase() {
            try {
                // CAMBIO: El if (Object.keys) ya no es necesario
                // if (Object.keys(firebaseConfig).length === 0) { ... }
                
                // setLogLevel('debug'); // Uncomment to see Firestore logs

                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                // Authentication
                await new Promise((resolve) => {
                    onAuthStateChanged(auth, async (user) => {
                        if (user) {
                            userId = user.uid;
                        } else {
                            // CAMBIO: El token inicial (de __initial_auth_token) ya no se usa,
                            // porque la config está insertada.
                            // if (initialAuthToken) { ... }
                            await signInAnonymously(auth);
                        }
                        // Wait for onAuthStateChanged before resolving
                        resolve();
                    });
                });

                // Once authenticated, get the final ID and configure the UI
                userId = auth.currentUser?.uid || crypto.randomUUID();
                currentUserIdSpan.textContent = userId;

                // Initialize report listener
                setupReportListener();
                
                console.log("Firebase initialized and user authenticated:", userId);

            } catch (error) {
                console.error("Error in initFirebase:", error);
                showMessage(`Initialization error: ${error.message}`, 'error');
                document.getElementById('loadingMessage').textContent = `Error: ${error.message}`;
            }
        }
        
        /**
         * Prepares the form for a new report, clearing fields and setting default values.
         */
        function newReport() {
            form.reset();
            const now = new Date();
            // Set service date to today's date (format YYYY-MM-DD)
            serviceDateInput.value = formatDateLocal(now);
            
            // Set default duration
            durationDaysInput.value = 0;
            durationHoursInput.value = 8;
            
            // Default select to the first technician name 
            if (technicianNameSelect.options.length > 1) {
                technicianNameSelect.value = TECHNICIANS[0]; 
            }
            
            // NUEVO: Set default service type
            serviceTypeSelect.value = 'Paid service';

            reportIdInput.value = generateReportId();
            
            // Set button to 'Save Report' state
            saveButtonText.textContent = 'Save Report';
            saveIcon.setAttribute('data-lucide', 'save');
            
            // Re-render Lucide icons
            lucide.createIcons();
            showMessage("New report started. Let's get to work!", 'success');
        }

        /**
         * Saves or updates the service report in Firestore.
         */
        async function saveReport(e) {
            e.preventDefault();

            if (!db || !userId) {
                showMessage("Cannot save: Database persistence is currently disabled or failed to initialize.", 'error');
                return;
            }
            
            // Gather all data
            const reportData = {
                reportId: reportIdInput.value,
                clientName: document.getElementById('clientName').value,
                serviceDate: document.getElementById('serviceDate').value,
                issueDescription: document.getElementById('issueDescription').value,
                workPerformed: document.getElementById('workPerformed').value,
                status: document.getElementById('status').value,
                
                technicianName: technicianNameSelect.value,
                serviceType: serviceTypeSelect.value, // NUEVO
                address: addressInput.value,
                city: cityInput.value,
                state: stateInput.value,
                zipCode: zipCodeInput.value,
                durationDays: parseInt(durationDaysInput.value || 0),
                durationHours: parseInt(durationHoursInput.value || 0),
                timestamp: serverTimestamp() 
            };

            // Build the private collection path
            // CAMBIO: Se elimina appId (ya no está definido) y se usa un path más simple.
            const reportRef = doc(db, `users/${userId}/service_reports`, reportData.reportId);

            try {
                await setDoc(reportRef, reportData);
                showMessage('Report saved/updated successfully!', 'success');
                // After saving, if it was a new report, clear the form for the next one.
                // CAMBIO: Verificar el prefijo 'SERVICE-'
                if (reportData.reportId.startsWith('SERVICE-')) {
                    newReport();
                }

            } catch (error) {
                console.error("Error saving report:", error);
                showMessage(`Error saving: ${error.message}`, 'error');
            }
        }

        /**
         * Listens for changes in the reports collection and updates the list.
         */
        function setupReportListener() {
             // CAMBIO: Se elimina appId (ya no está definido) y se usa un path más simple.
            const reportsColRef = collection(db, `users/${userId}/service_reports`);
            // Query the last 10 reports
            const q = query(reportsColRef, limit(10)); 

            onSnapshot(q, (snapshot) => {
                const reports = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    reports.push({ ...data, id: doc.id }); 
                });
                
                // Sort client-side (in-memory) by serviceDate (descending)
                reports.sort((a, b) => {
                    const dateA = new Date(a.serviceDate);
                    const dateB = new Date(b.serviceDate);
                    if (isNaN(dateA) || isNaN(dateB)) return 0; // Skip if dates are invalid
                    return dateB - dateA;
                });

                renderReportList(reports);
            }, (error) => {
                console.error("Error listening for reports:", error);
                showMessage("Error loading report list.", 'error');
            });
        }

        /**
         * Renders the list of reports in the DOM.
         * @param {Array<Object>} reports - The list of reports.
         */
        function renderReportList(reports) {
            reportsList.innerHTML = '';
            document.getElementById('loadingMessage').classList.add('hidden');

            if (reports.length === 0) {
                reportsList.innerHTML = '<p class="text-center text-gray-500 py-4">No reports saved yet.</p>';
                return;
            }

            reports.forEach(report => {
                const statusColor = report.status === 'Completed' ? 'bg-green-100 text-green-800' : 
                                    report.status === 'Pending' ? 'bg-yellow-100 text-yellow-800' : 
                                    'bg-red-100 text-red-800';

                // Format date for list display
                const date = formatReadableDate(report.serviceDate);
                
                // Construct full address for display
                const fullAddress = report.address ? `${report.address}, ${report.city || ''}` : report.city || 'N/A';
                
                // Construct duration string for list display
                const days = report.durationDays || 0;
                const hours = report.durationHours || 0;
                let durationString = `${days}D ${hours}H`;


                const reportItem = document.createElement('div');
                reportItem.className = 'p-4 border border-gray-200 rounded-lg shadow-sm hover:bg-gray-50 cursor-pointer transition duration-150';
                reportItem.innerHTML = `
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-semibold text-brand-blue-dark">${report.reportId}</span>
                        <span class="text-xs font-medium px-2 py-0.5 rounded-full ${statusColor}">${report.status}</span>
                    </div>
                    <p class="text-lg font-bold text-gray-800">${report.clientName}</p>
                    <p class="text-sm text-gray-600 mb-2">${fullAddress}</p>
                    <p class="text-xs text-gray-500">Date: ${date}</p>
                    <p class="text-xs text-gray-500">Duration: ${durationString}</p>
                    <p class="text-xs text-gray-500">Technician: ${report.technicianName || 'N/A'}</p>
                    <p class="text-xs text-gray-500">Type: ${report.serviceType || 'N/A'}</p> <!-- NUEVO -->
                `;

                // Event to load the report into the form for editing
                reportItem.addEventListener('click', () => editReport(report));
                reportsList.appendChild(reportItem);
            });
            lucide.createIcons(); // Re-render icons if any
        }
        
        /**
         * Loads the data of a selected report into the form for editing.
         * @param {Object} report - The report object.
         */
        function editReport(report) {
            reportIdInput.value = report.reportId;
            document.getElementById('clientName').value = report.clientName;
            serviceDateInput.value = report.serviceDate; 
            
            // Populate new fields
            technicianNameSelect.value = report.technicianName || ""; // Set selected name
            serviceTypeSelect.value = report.serviceType || 'Paid service'; // NUEVO
            addressInput.value = report.address || '';
            cityInput.value = report.city || '';
            stateInput.value = report.state || '';
            zipCodeInput.value = report.zipCode || '';
            durationDaysInput.value = report.durationDays || 0;
            durationHoursInput.value = report.durationHours || 0;

            document.getElementById('issueDescription').value = report.issueDescription;
            document.getElementById('workPerformed').value = report.workPerformed;
            document.getElementById('status').value = report.status;

            // Change button to 'Update Report' state
            saveButtonText.textContent = 'Update Report';
            saveIcon.setAttribute('data-lucide', 'edit-3');

            // Scroll to the form
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showMessage(`Editing report ${report.reportId} for ${report.clientName}`, 'success');
            lucide.createIcons();
        }

        // --- INITIALIZATION AND LISTENERS ---
        
        /**
         * Main setup function to run the application.
         */
        function setupApp() {
            // 1. Setup UI elements immediately
            populateTechnicianDropdown();
            newReport(); // Prepares form with defaults and IDs
            lucide.createIcons();
            
            // 2. Attach static listeners
            form.addEventListener('submit', saveReport);
            newReportButton.addEventListener('click', newReport);
            exportPdfButton.addEventListener('click', exportToPDF);
            
            // 3. Initialize Firebase asynchronously for data persistence
            initFirebase();
        }

        window.onload = setupApp;
    </script>
</body>
